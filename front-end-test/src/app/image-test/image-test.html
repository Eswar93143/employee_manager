<div class="image-upload">

  <input
    type="file"
    #fileInput
    accept="image/*"
    hidden
    (change)="onFileSelected($event)"
  />

  <!-- Upload area -->
   @if(!imagePreview){
       <div
         class="upload-box"
         (click)="fileInput.click()"
       >
         <div class="upload-icon">📷</div>
     
         <h3>Upload Image</h3>
         <p>Click to select an image</p>
         <span>PNG, JPG, JPEG</span>
       </div>
   }

  <!-- Image preview -->
   @if(imagePreview){
       <div class="preview-box">

         <img
           [src]="imagePreview"
           [alt]="fileName"
           class="image-preview"
         />

         <div class="file-info">
           <span class="file-name">
             {{ fileName }}
           </span>

           <button
             type="button"
             class="change-btn"
             (click)="fileInput.click()"
           >
             Change
           </button>

           <button
             type="button"
             class="remove-btn"
             (click)="removeImage()"
           >
             Remove
           </button>
         </div>

       </div>
   }
</div>
